name: Build OpenWrt Firmware

on:
  push:
    branches: [ "gh-actions-workflow", "main" ]
  schedule:
    - cron: '0 3 * * 1'

env:
  OPENWRT_VERSION: "25.12"
  ARCHITECTURE: "x86_64"
  IMAGE_TYPE: "vmdk"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/pipx \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby || true
          sudo apt-get clean || true
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz mkisofs msmtp ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          rm -rf build_dir
          git clone --depth 1 -b v25.12.0 https://git.openwrt.org/openwrt/openwrt.git build_dir

      - name: Clone Third-Party Plugins
        run: |
          cd build_dir/package
          rm -rf luci-theme-argon openwrt-passwall openwrt-passwall-packages OpenClash
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git openwrt-passwall-packages
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall.git openwrt-passwall
          git clone --depth 1 https://github.com/vernesong/OpenClash.git OpenClash

      - name: Update and Install Feeds
        run: |
          cd build_dir
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > build_dir/.config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_generic=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_IMAGES_VMDK=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-i8n-base-zh-cn=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_tuic_client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria2_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus is not set
          # CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set
          # CONFIG_PACKAGE_shadowsocks-rust-ssserver is not set
          # CONFIG_PACKAGE_rust is not set
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-sqm=y
          EOF

      - name: Customize Network (DHCP)
        run: |
          mkdir -p build_dir/files/etc/config
          cat > build_dir/files/etc/config/network <<'EOF'
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0'

          config interface 'lan'
          	option device 'br-lan'
          	option proto 'dhcp'
          EOF

      - name: Build Firmware
        run: |
          cd build_dir
          make defconfig
          if [ -d feeds/packages/lang/rust ]; then
            find feeds/packages/lang/rust -type f -exec sed -i -E 's/(download-ci-llvm[[:space:]]*=[[:space:]]*)true/\1false/g' {} +
            grep -rn "download-ci-llvm" feeds/packages/lang/rust/ || true
          fi
          rm -rf build_dir/target-x86_64_musl/host/rustc-* || true
          make download -j8
          find dl -size -1024c -delete || true
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          if ! make -j$(nproc); then
            echo "=== Retrying rust [host] with verbose output ==="
            make package/feeds/packages/rust/host/clean || true
            make package/feeds/packages/rust/host/compile -j1 V=s
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-vmdk
          path: |
            build_dir/bin/targets/x86/64/*.vmdk*
            build_dir/bin/targets/x86/64/*.img.gz
            build_dir/bin/targets/x86/64/*.tar.gz
          if-no-files-found: warn
