name: Build OpenWrt Firmware

on:
  push:
    branches: [ "gh-actions-workflow", "main" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12"
  ARCHITECTURE: "x86_64"
  IMAGE_TYPE: "vmdk"
  GOPROXY: "https://proxy.golang.org,https://goproxy.cn,direct"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Free Up Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/pipx \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby || true
          sudo apt-get clean || true
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz mkisofs msmtp ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          rm -rf build_dir
          git clone --depth 1 -b v25.12.0 https://git.openwrt.org/openwrt/openwrt.git build_dir

      - name: Clone Third-Party Plugins
        run: |
          cd build_dir/package
          rm -rf luci-theme-argon OpenClash luci-app-cloudflared
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon
          git clone --depth 1 https://github.com/vernesong/OpenClash.git OpenClash
          git clone --depth 1 https://github.com/Lancenas/luci-app-cloudflared.git luci-app-cloudflared || true

      - name: Update and Install Feeds
        run: |
          cd build_dir
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > build_dir/.config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_generic=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_VMDK_IMAGES=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-i8n-base-zh-cn=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_cloudflared=y
          CONFIG_PACKAGE_luci-app-cloudflared=y
          CONFIG_PACKAGE_luci-app-sqm=y
          EOF

      - name: Customize Network (DHCP)
        run: |
          mkdir -p build_dir/files/etc/config
          cat > build_dir/files/etc/config/network <<'EOF'
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0'

          config interface 'lan'
          	option device 'br-lan'
          	option proto 'dhcp'
          EOF

      - name: Build Firmware and Package Target VMDK
        run: |
          cd build_dir
          make defconfig
          grep -E "VMDK|cloudflared|tailscale" .config || true

          if [ -d package/luci-app-cloudflared ]; then
            find package/luci-app-cloudflared -path "*/etc/config/cloudflared" -delete || true
            find package/luci-app-cloudflared -path "*/etc/init.d/cloudflared" -delete || true
            find package/luci-app-cloudflared -name "Makefile" -exec sed -i \
              -e '/etc\/config\/cloudflared/d' \
              -e '/etc\/init\.d\/cloudflared/d' {} +
          fi

          if [ -d feeds/packages/lang/rust ]; then
            find feeds/packages/lang/rust -type f -exec sed -i -E 's/(download-ci-llvm[[:space:]]*=[[:space:]]*)(true|false|"if-unchanged")/\1false/g' {} +
          fi
          make package/feeds/packages/rust/host/clean || true
          GOPROXY="${GOPROXY}" make download -j8
          find dl -size -1024c -delete || true
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          if ! make -j$(nproc); then
            echo "=== Diagnosing package/install with -j1 V=s ==="
            rm -rf build_dir/target-x86_64_musl/root-x86 staging_dir/target-x86_64_musl/stamp/.package_install
            make package/install -j1 V=s
            make -j1 V=s
          fi

          TARGET_DIR="bin/targets/x86/64"
          OUT_DIR="${GITHUB_WORKSPACE}/release_out"
          mkdir -p "${OUT_DIR}"

          VMDK_FILE=""
          if [ -f "${TARGET_DIR}/openwrt-x86-64-generic-ext4-combined.vmdk" ]; then
            VMDK_FILE="${TARGET_DIR}/openwrt-x86-64-generic-ext4-combined.vmdk"
          else
            VMDK_FILE=$(find "${TARGET_DIR}" -maxdepth 1 -type f -name "*ext4*combined*.vmdk" | head -n 1 || true)
          fi

          if [ -z "${VMDK_FILE}" ] || [ ! -f "${VMDK_FILE}" ]; then
            echo "ERROR: Target ext4 combined vmdk not found under ${TARGET_DIR}"
            ls -lh "${TARGET_DIR}" || true
            exit 1
          fi

          cp -f "${VMDK_FILE}" "${OUT_DIR}/openwrt-x86-64-generic-ext4-combined.vmdk"
          tar -czvf "${OUT_DIR}/openwrt-x86-64-generic-ext4-combined.vmdk.tar.gz" \
            -C "${OUT_DIR}" "openwrt-x86-64-generic-ext4-combined.vmdk"
          rm -f "${OUT_DIR}/openwrt-x86-64-generic-ext4-combined.vmdk"
          ls -lh "${OUT_DIR}/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-x86-64-generic-ext4-combined-vmdk
          path: release_out/openwrt-x86-64-generic-ext4-combined.vmdk.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.12-x86_64-${{ github.run_number }}
          name: OpenWrt 25.12 x86_64 ext4 VMDK (${{ github.run_number }})
          files: release_out/openwrt-x86-64-generic-ext4-combined.vmdk.tar.gz
          draft: false
          prerelease: false
